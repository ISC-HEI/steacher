user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;
    send_timeout          180s;

    # Limits
    client_max_body_size 10m;

    # Rate limiting zones (keyed by client IP)
    # Auth endpoints: 10 requests per minute with burst 20
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    # Password reset endpoints: 5 requests per minute with burst 10
    limit_req_zone $binary_remote_addr zone=pwdreset:10m rate=5r/m;
    # Respond with 429 when throttled
    limit_req_status 429;

    # Http
    server {
        listen 80;
        server_name steacher.org;

        location /.well-known/acme-challenge/ {
            root /app/static;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Https
    server {
        listen 443 ssl;
        http2 on;
        server_name steacher.org;

        ssl_certificate /etc/letsencrypt/live/steacher.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/steacher.org/privkey.pem;

        # TLS hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # Consider a CSP tailored to your front-end
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

        # Proxy to web service
        # Exact-match throttling for sensitive endpoints
        location = /accounts/login/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /admin/login/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /accounts/password_reset/ {
            limit_req zone=pwdreset burst=10 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static and media (read-only mounts)       
        location /static/ {  # catch-all for non-hashed static assets
            alias /app/staticfiles/;
            expires 1h;
            add_header Cache-Control "public";
            access_log off;
        }
        location ~ ^/static/(.+\.mjs)$ {  # fix for mjs files, because of wrong content type
            alias /app/staticfiles/$1;
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        # Long-cache hashed static assets produced by ManifestStaticFilesStorage
        location ~* ^/static/(.+\.[0-9a-f]{8,}\.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map))$ {
            alias /app/staticfiles/$1;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location /media/ {
            alias /app/media/;
        }
    }
}
