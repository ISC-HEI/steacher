{% extends "exercises/base.html" %}

{% block content %}
<div class="container">
    <div class="columns is-centered">
        <div class="column is-half">
            <h2 class="title is-2">Create your account</h2>

            {% if errors %}
                <div class="notification is-danger">
                    <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="box">
                <div class="field">
                    <label class="label">Email</label>
                    <div class="control">
                        <input class="input" type="email" name="email" required value="{{ email|default:'' }}">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Password</label>
                    <div class="control">
                        <input class="input" type="password" name="password1" required>
                    </div>
                </div>
                <div class="field">
                    <label class="label">Confirm Password</label>
                    <div class="control">
                        <input class="input" type="password" name="password2" required>
                    </div>
                </div>
                <div class="field">
                    <label class="label">Preferred Language</label>
                    <div class="control">
                        <div class="select is-fullwidth">
                            <select name="preferred_language" required>
                                <option value="fr">French</option>
                                <option value="de">German</option>
                                <option value="en">English</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="field">
                    <div class="control">
                        <button type="submit" class="button is-primary">Register</button>
                    </div>
                </div>
                </div>
            </form>

            <p><a href="{% url 'login' %}">Already have an account? Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
