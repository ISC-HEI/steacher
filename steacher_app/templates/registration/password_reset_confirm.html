{% extends "registration/auth_base.html" %}

{% block auth_page_title %}Reset Password{% endblock %}

{% block auth_content %}
<h2 class="title is-3">Choose a new password</h2>
<form method="post">{% csrf_token %}
  <div class="password-reset-form choose-new-password-form">
    {{ form.as_p }}
  </div>
  <button class="button is-primary" type="submit">Change password</button>
</form>
{% endblock %}
