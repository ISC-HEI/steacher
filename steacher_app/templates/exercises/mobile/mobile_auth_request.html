<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Steacher</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <style>
        body {
            background: whitesmoke;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        .login-box {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        #email-input {
            background: white;
            color: black;
        }
        #code-input {
            background: white;
            color: black;
            letter-spacing: 0.25em;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo img {
            height: 48px;
        }
        .logo h1 {
            margin-top: 12px;
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="/static/images/steacher_logo.png" alt="Steacher">
                <h1>Steacher Mobile</h1>
            </div>

            
            <form id="login-form">

                <div class="content">
                    <p style="color: black;">Enter your email to receive a login link and code.</p>
                </div>

                <div class="field">
                    <div class="control">
                        <input 
                            class="input" 
                            type="email" 
                            id="email-input"
                            placeholder="your.email@example.com" 
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>
                
                <div class="field">
                    <button class="button is-primary is-fullwidth" type="submit" id="submit-button">
                        Send Email
                    </button>
                </div>
                
            </form>
            <div id="message-box" style="display: none;"></div>

            <form id="code-form" style="display: none;">
                <div class="content" style="margin-top: 20px;">
                    <p style="color: black; margin-bottom: 8px;">
                        Hey, we just sent you a link.
                    </p>
                    <p style="color: black; margin-bottom: 8px;">
                        Click on this link or enter the code below.
                    </p>
                </div>

                <div class="field">
                    <div class="control">
                        <input
                            class="input"
                            type="text"
                            id="code-input"
                            placeholder="123456"
                            inputmode="numeric"
                            pattern="[0-9]{6}"
                            maxlength="6"
                            autocomplete="one-time-code"
                            required
                        >
                    </div>
                    <p class="help">6-digit code</p>
                </div>

                <div class="field">
                    <button class="button is-primary is-fullwidth" type="submit" id="verify-button">
                        Verify Code
                    </button>
                </div>
                <div class="field">
                    <button class="button is-light is-fullwidth" type="button" id="resend-button">
                        Resend Email
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email-input');
        const submitButton = document.getElementById('submit-button');
        const messageBox = document.getElementById('message-box');
        const codeForm = document.getElementById('code-form');
        const codeInput = document.getElementById('code-input');
        const verifyButton = document.getElementById('verify-button');
        const resendButton = document.getElementById('resend-button');
        let submittedEmail = '';

        function showMessage(message, kind = 'is-success') {
            messageBox.style.display = 'block';
            messageBox.className = `notification ${kind}`;
            messageBox.textContent = message;
        }

        function onlyDigits(value) {
            return value.replace(/\D/g, '').slice(0, 6);
        }

        async function sendAuthEmail(email) {
            const formData = new FormData();
            formData.append('email', email);
            const response = await fetch('{% url "mobile:mobile_auth_send_link" %}', {
                method: 'POST',
                body: formData,
            });
            return response.json();
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            if (!email) return;
            
            submitButton.classList.add('is-loading');
            submitButton.disabled = true;
            
            try {
                await sendAuthEmail(email);
                submittedEmail = email;
                
                // Hide the form
                form.style.display = 'none';
                codeForm.style.display = 'block';
                
                // Show success message
                showMessage('Check your email for the login link or code. Note: University email may take 2-3 minutes to arrive.', 'is-success');
                
            } catch (error) {
                showMessage('An error occurred. Please try again.', 'is-danger');
            } finally {
                submitButton.classList.remove('is-loading');
                submitButton.disabled = false;
            }
        });

        codeInput.addEventListener('input', () => {
            codeInput.value = onlyDigits(codeInput.value);
        });

        codeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = onlyDigits(codeInput.value.trim());
            codeInput.value = code;
            if (!submittedEmail || code.length !== 6) {
                showMessage('Please enter a valid six-digit code.', 'is-danger');
                return;
            }

            verifyButton.classList.add('is-loading');
            verifyButton.disabled = true;

            try {
                const formData = new FormData();
                formData.append('email', submittedEmail);
                formData.append('code', code);
                const response = await fetch('{% url "mobile:mobile_auth_verify_code" %}', {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();
                if (!response.ok || data.status !== 'success') {
                    showMessage(data.message || 'Invalid or expired code.', 'is-danger');
                    return;
                }
                window.location.href = data.redirect_url || '{% url "mobile:mobile_dashboard" %}';
            } catch (error) {
                showMessage('An error occurred. Please try again.', 'is-danger');
            } finally {
                verifyButton.classList.remove('is-loading');
                verifyButton.disabled = false;
            }
        });

        resendButton.addEventListener('click', async () => {
            if (!submittedEmail) {
                showMessage('Please enter your email first.', 'is-danger');
                return;
            }
            resendButton.classList.add('is-loading');
            resendButton.disabled = true;
            try {
                await sendAuthEmail(submittedEmail);
                showMessage('Email resent. Use the most recent code.', 'is-success');
            } catch (error) {
                showMessage('Could not resend email. Please try again.', 'is-danger');
            } finally {
                resendButton.classList.remove('is-loading');
                resendButton.disabled = false;
            }
        });
    </script>
</body>
</html>
