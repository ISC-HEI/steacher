{% extends 'exercises/exercise.html' %}
{% load static %}

{% block title %}{{ exercise.title }} - Scala{% endblock %}

{% block exercise_content %}
<div id="scala-exercise-app"
     v-cloak
     data-static-prefix="{% get_static_prefix %}">
    {% csrf_token %}
    <div class="exercise-container">
        <div class="left-panel">
            <div class="exercise">
                <div class="content mb-0">
                    <div v-if="exercise.question"
                         v-html="renderMarkdown(exercise.question)"
                         class="box content mb-3 initial-question">
                    </div>
                    <div class="field mb-0">
                        <div class="control">
                            <code-mirror-editor
                                persistence-key="scala-{{ exercise.id }}"
                                language="scala"
                                v-model="userCode"
                                :placeholder="'// Write your Scala code here'"
                                @run-query="runCode">
                            </code-mirror-editor>
                        </div>
                        <div class="field is-grouped exercise-controls mt-2">
                            <div class="control">
                                <button
                                    @click="runCode"
                                    class="button is-primary"
                                    :class="{ 'is-loading': loadingState !== 'idle' }"
                                    :disabled="!userCode.trim() || loadingState !== 'idle'">
                                    <span class="icon"><i class="fas fa-play"></i></span>
                                    <span>Run Code</span>
                                </button>
                            </div>
                            <div class="control">
                                <button
                                    @click="giveHint"
                                    class="button is-info"
                                    :class="{ 'is-loading': loadingState !== 'idle' }"
                                    :disabled="loadingState !== 'idle'">
                                    <span class="icon"><i class="fas fa-lightbulb"></i></span>
                                    <span>Gimme a Hint</span>
                                </button>
                            </div>
                    <div class="control" v-if="solutionUnlocked">
                        <button
                            @click="getGuidance('reveal_solution')"
                            class="button is-info"
                            :disabled="loadingState !== 'idle'"
                            title="You have made enough attempts at this question. If you wish, you can reveal the solution.">
                            <span>🧨 Show solution (spoiler)</span>
                        </button>
                    </div>
                        </div>
                    </div>
                </div>
                <div class="field has-addons mt-6 mb-0">
                    <div class="control is-expanded">
                        <input class="input"
                               type="text"
                               placeholder="// Quick test snippet"
                               v-model="testSnippet"
                               @keyup.enter="runTestSnippet"
                               :disabled="loadingState !== 'idle'">
                    </div>
                    <div class="control">
                        <button
                            @click="runTestSnippet"
                            class="button is-success"
                            :class="{ 'is-loading': loadingState !== 'idle' }"
                            :disabled="!testSnippet.trim() || loadingState !== 'idle'">
                            <span class="icon"><i class="fas fa-vial"></i></span>
                            <span>Test</span>
                        </button>
                    </div>
                </div>
                <div class="exercise-output mt-2">
                    <pre class="has-background-black p-5 is-size-6 console-output"
                         :class="{ 'has-text-danger': !!executionError, 'has-text-white': !executionError }">[[ executionOutput ]]</pre>
                </div>
            </div>
        </div>
        <div class="right-panel">
            <chatbot-panel
                ref="chatbotPanel"
                :loading="loadingState === 'getting-guidance'"
                :attempt-id="{{ attempt_id }}"
                next-exercise-url="{% if next_exercise %}{% url 'exercises:exercise_detail' next_exercise.pk %}{% endif %}"
                :solution-unlocked-initial="{{ solution_unlocked|yesno:'true,false' }}"
                @question-asked="handleQuestion"
                @solution-unlocked="solutionUnlocked = $event"
                @reveal-solution="getGuidance('reveal_solution')"
                >
            </chatbot-panel>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}

<!-- Import Map for Bare Module Specifiers -->
<script type="importmap">
{
  "imports": {
    "vue": "{% static 'vue/dist/vue.esm-browser.js' %}",
    "canvas-confetti": "{% static 'canvas-confetti/dist/confetti.module.mjs' %}",
    "./ChatbotPanel.js": "{% static 'js/dist/ChatbotPanel.js' %}",
    "marked": "{% static 'marked/lib/marked.esm.js' %}",
    "dompurify": "{% static 'dompurify/dist/purify.es.mjs' %}",
    "./CodeMirrorEditor.js": "{% static 'js/dist/CodeMirrorEditor.js' %}",
    "codemirror-bundle": "{% static 'js/dist/codemirror-bundle.js' %}"
  }
}
</script>

<!-- Our JavaScript -->
<script type="module" src="{% static 'js/dist/scala.js' %}"></script>

{% endblock %}
