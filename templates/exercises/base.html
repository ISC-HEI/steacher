<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Steacher{% endblock %}</title>

     <!-- Favicon -->
     <link rel="shortcut icon" href="{% load static %}{% static 'images/favicon.ico' %}" type="image/x-icon">
     <link rel="icon" href="{% load static %}{% static 'images/favicon.png' %}" type="image/png">
    
    
    <!-- Vue.js 3 from node_modules -->
    <script src="{% static 'vue/dist/vue.global.js' %}"></script>
    
    <!-- Bulma CSS from node_modules -->
    <link rel="stylesheet" href="{% static 'bulma/css/bulma.min.css' %}">
    
    <!-- Font Awesome from node_modules -->
    <link rel="stylesheet" href="{% static '@fortawesome/fontawesome-free/css/all.min.css' %}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% load static %}{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar is-primary" role="navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="{% url 'exercises:exercise_list' %}">
                <strong>Steacher</strong>
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        {% block content %}
        {% endblock %}
    </div>
    
    {% block scripts %}
    {% endblock %}
</body>
</html>
