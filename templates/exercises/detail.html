{% extends 'exercises/base.html' %}
{% load static %}

{% block title %}{{ exercise.title }} - Exercise Platform{% endblock %}

{% block content %}
<nav class="breadcrumb" aria-label="breadcrumbs">
    <ul>
        <li><a href="{% url 'exercises:list' %}">Exercises</a></li>
        <li class="is-active"><a href="#" aria-current="page">{{ exercise.title }}</a></li>
    </ul>
</nav>

<div id="exercise-app">
    <!-- Exercise component will be rendered here by Vue.js -->
    <component 
        :is="exerciseComponent" 
        :exercise="exercise"
        :previous-answer="previousAnswer"
        @answer-submitted="handleAnswerSubmitted">
    </component>
</div>
{% endblock %}

{% block scripts %}
<script>
const { createApp } = Vue;

// Multiple Choice Exercise Component
const multiple_choice = {
    props: ['exercise', 'previousAnswer'],
    emits: ['answer-submitted'],
    template: `
        <div class="card">
            <header class="card-header">
                <p class="card-header-title">
                    {{ exercise.title }}
                </p>
                <span class="tag is-info">{{ exercise.exercise_type }}</span>
            </header>
            <div class="card-content">
                <div class="content">
                    <p class="is-size-5" v-if="exercise.description">{{ exercise.description }}</p>
                    
                    <div class="question-section">
                        <h4 class="title is-4">{{ exercise.exercise_data.question }}</h4>
                        
                        <div class="field">
                            <div 
                                v-for="choice in exercise.exercise_data.choices" 
                                :key="choice.id"
                                class="field">
                                <div class="control">
                                    <label class="radio choice-option" 
                                           :class="{
                                               'has-text-success': submitted && showResult && choice.is_correct,
                                               'has-text-danger': submitted && showResult && selectedChoice === choice.id && !choice.is_correct
                                           }">
                                        <input 
                                            type="radio" 
                                            :name="'choice-' + exercise.id"
                                            :value="choice.id"
                                            v-model="selectedChoice"
                                            :disabled="submitted && showResult">
                                        {{ choice.text }}
                                        <span v-if="submitted && showResult && choice.is_correct" class="icon has-text-success">
                                            <i class="fas fa-check-circle"></i>
                                        </span>
                                        <span v-if="submitted && showResult && selectedChoice === choice.id && !choice.is_correct" class="icon has-text-danger">
                                            <i class="fas fa-times-circle"></i>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div v-if="submitted && showResult" class="notification" :class="isCorrect ? 'is-success' : 'is-danger'">
                        <h5 class="title is-5" v-if="isCorrect">✅ Correct!</h5>
                        <h5 class="title is-5" v-else>❌ Incorrect</h5>
                        <p>{{ feedbackMessage }}</p>
                    </div>
                    
                    <div v-if="error" class="notification is-danger">
                        {{ error }}
                    </div>
                </div>
            </div>
            <footer class="card-footer">
                <div class="card-footer-item">
                    <div class="field is-grouped">
                        <div class="control">
                            <button 
                                @click="submitAnswer"
                                :disabled="!selectedChoice || (submitted && showResult)"
                                class="button is-primary"
                                :class="{ 'is-loading': submitting }">
                                <span v-if="!submitting">Submit Answer</span>
                            </button>
                        </div>
                        
                        <div class="control" v-if="submitted && showResult">
                            <button 
                                @click="resetAnswer"
                                class="button is-light">
                                Try Again
                            </button>
                        </div>
                        
                        <div class="control">
                            <a href="{% url 'exercises:list' %}" class="button is-outlined">
                                Back to Exercises
                            </a>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    `,
    data() {
        return {
            selectedChoice: this.previousAnswer?.user_answer || null,
            submitted: false,
            submitting: false,
            showResult: false,
            isCorrect: false,
            error: null,
            feedbackMessage: ''
        }
    },
    methods: {
        async submitAnswer() {
            if (!this.selectedChoice) return;
            
            this.submitting = true;
            this.error = null;
            
            try {
                                 const response = await fetch('/exercises/{{ exercise.pk }}/submit/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        answer: this.selectedChoice
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    this.submitted = true;
                    this.isCorrect = data.is_correct;
                    this.showResult = true;
                    this.feedbackMessage = data.message;
                    this.$emit('answer-submitted', data);
                } else {
                    this.error = data.error || 'Failed to submit answer';
                }
            } catch (err) {
                this.error = 'Network error occurred. Please try again.';
                console.error('Submit error:', err);
            } finally {
                this.submitting = false;
            }
        },
        
        resetAnswer() {
            this.selectedChoice = null;
            this.submitted = false;
            this.showResult = false;
            this.isCorrect = false;
            this.error = null;
            this.feedbackMessage = '';
        }
    }
};

 // Main Vue App
createApp({
    data() {
        return {
            exercise: {{ exercise|safe }},
            previousAnswer: {{ previous_answer|safe }}
        }
    },
    computed: {
        exerciseComponent() {
            // Direct 1:1 mapping between database exercise_type and component name
            return this.exercise.exercise_type;
        }
    },
    components: {
        'multiple_choice': multiple_choice
    },
    methods: {
        handleAnswerSubmitted(data) {
            console.log('Answer submitted:', data);
            // Handle global actions after answer submission if needed
        }
    }
}).mount('#exercise-app');
</script>

<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}
