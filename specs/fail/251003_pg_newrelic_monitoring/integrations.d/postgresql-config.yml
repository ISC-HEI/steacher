integrations:
  - name: nri-flex
    interval: 60s
    config:
      name: postgresqlFlex
      apis:
        # Database connection and transaction metrics
        - name: PostgresqlDatabase
          database: postgres
          db_conn: "host=db port=5432 user=newrelic password=${NRIA_POSTGRESQL_PASSWORD} dbname=steacher_prod sslmode=disable"
          db_query: >-
            SELECT
              datname as database_name,
              numbackends as active_connections,
              xact_commit as transactions_committed,
              xact_rollback as transactions_rolled_back,
              blks_read as blocks_read,
              blks_hit as blocks_hit,
              tup_returned as tuples_returned,
              tup_fetched as tuples_fetched,
              tup_inserted as tuples_inserted,
              tup_updated as tuples_updated,
              tup_deleted as tuples_deleted
            FROM pg_stat_database
            WHERE datname = 'steacher_prod'

        # Top 20 tables by size and activity
        - name: PostgresqlTable
          database: postgres
          db_conn: "host=db port=5432 user=newrelic password=${NRIA_POSTGRESQL_PASSWORD} dbname=steacher_prod sslmode=disable"
          db_query: >-
            SELECT
              schemaname as schema_name,
              relname as table_name,
              seq_scan as sequential_scans,
              seq_tup_read as sequential_tuples_read,
              idx_scan as index_scans,
              idx_tup_fetch as index_tuples_fetched,
              n_tup_ins as tuples_inserted,
              n_tup_upd as tuples_updated,
              n_tup_del as tuples_deleted,
              n_live_tup as live_tuples,
              n_dead_tup as dead_tuples
            FROM pg_stat_user_tables
            ORDER BY n_live_tup DESC
            LIMIT 20

        # Connection states
        - name: PostgresqlConnection
          database: postgres
          db_conn: "host=db port=5432 user=newrelic password=${NRIA_POSTGRESQL_PASSWORD} dbname=steacher_prod sslmode=disable"
          db_query: >-
            SELECT
              COALESCE(state, 'unknown') as state,
              COUNT(*) as connection_count
            FROM pg_stat_activity
            WHERE datname = 'steacher_prod'
            GROUP BY state

        # Database size
        - name: PostgresqlSize
          database: postgres
          db_conn: "host=db port=5432 user=newrelic password=${NRIA_POSTGRESQL_PASSWORD} dbname=steacher_prod sslmode=disable"
          db_query: >-
            SELECT
              pg_database_size('steacher_prod') / 1024 / 1024 as database_size_mb

        # Slow queries (queries running longer than 5 seconds)
        - name: PostgresqlSlowQueries
          database: postgres
          db_conn: "host=db port=5432 user=newrelic password=${NRIA_POSTGRESQL_PASSWORD} dbname=steacher_prod sslmode=disable"
          db_query: >-
            SELECT
              pid,
              usename as username,
              application_name,
              state,
              EXTRACT(EPOCH FROM (NOW() - query_start)) as query_duration_seconds,
              LEFT(query, 100) as query_preview
            FROM pg_stat_activity
            WHERE datname = 'steacher_prod'
              AND state != 'idle'
              AND query_start < NOW() - INTERVAL '5 seconds'
              AND query NOT LIKE '%pg_stat_activity%'
            ORDER BY query_start
            LIMIT 10
