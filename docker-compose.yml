services:
  web:
    build:
      context: ./steacher_app
    env_file:
      - .env.production
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - 8000
    depends_on:
      - db

  db:
    image: postgres:15
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/static
      - media_data:/app/media
      - ./certbot_data/etc:/etc/letsencrypt:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot_data/etc:/etc/letsencrypt
      - static_data:/app/static

volumes:
  postgres_data:
  static_data:
  media_data:
