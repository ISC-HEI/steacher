services:
  web:
    build:
      context: ./steacher_app
    hostname: steacher1
    env_file:
      - .env.production
    environment:
      - SCALA_INTERPRETER_URL=http://scala_interpreter:8642
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./logs:/app/logs
    expose:
      - 8000
    depends_on:
      - db
      - redis
      - scala_interpreter
    networks:
      - frontend
      - backend
      - compute

  db:
    image: postgres:17.7
    restart: unless-stopped
    env_file:
      - .env.production
    command: > # pg_stat_statements is a performance monitoring extension for PostgreSQL
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Consider isolation on a backend network with only the web service
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp

  proxy:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Maintenance flag and page directory (read-only)
      - ./nginx/maintenance:/var/www:ro
      - static_data:/app/static
      - media_data:/app/media
      - ./certbot_data/etc:/etc/letsencrypt:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ "ALL" ]
    cap_add: [ "NET_BIND_SERVICE", "CHOWN", "SETGID", "SETUID" ]
    depends_on:
      - web
    networks:
      - frontend

  scala_interpreter:
    # No ports exposed to host; reachable internally at http://scala_interpreter:8642
    build:
      context: ./scala_interpreter
      args:
        BUILD_PLATFORM: linux/amd64
    environment:
      - PORT=8642
      # cap memory for interpreter
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m
    restart: unless-stopped
    user: "10001:10001"  # reenforce non-root user
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Runtime limits effective in docker compose (non-swarm):
    mem_limit: 1g               # mirrors -Xmx but caps total container memory
    cpus: "1"                   # or cpu_quota: 50000 & cpu_period: 100000
    pids_limit: 256             # blocks fork bombs
    ulimits:
      nproc: 512
      nofile: 4096
    stop_grace_period: 5s
    networks:
      # internal network prevents outbound Internet; only containers on this network can talk
      - compute

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    expose:
      - 3000
    depends_on:
      - db
    networks:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot_data/etc:/etc/letsencrypt
      - static_data:/app/static
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/letsencrypt
      - /var/log/letsencrypt
    security_opt:
      - no-new-privileges:true
    cap_drop: [ "ALL" ]
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  metabase_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # no outbound egress  
  compute:
    driver: bridge
    internal: true  # no outbound egress
  maintenance:
    driver: bridge