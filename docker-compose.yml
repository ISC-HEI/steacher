services:
  web:
    build:
      context: ./steacher_app
    hostname: steacher1
    env_file:
      - .env.production
    environment:
      - SCALA_INTERPRETER_URL=http://scala_interpreter:8642
      - NEW_RELIC_CONFIG_FILE=/app/newrelic.ini
      - NEW_RELIC_APP_NAME=Steacher
      - NEW_RELIC_LOG=stdout
      - NEW_RELIC_LOG_LEVEL=info
      - NEW_RELIC_PROCESS_HOST_DISPLAY_NAME=steacher1
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - 8000
    depends_on:
      - db
      - redis
      - scala_interpreter
    networks:
      - frontend
      - backend
      - compute

  db:
    image: postgres:17.6
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Consider isolation on a backend network with only the web service
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp

  proxy:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Maintenance flag and page directory (read-only)
      - ./nginx/maintenance:/var/www:ro
      - static_data:/app/static
      - media_data:/app/media
      - ./certbot_data/etc:/etc/letsencrypt:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ "ALL" ]
    cap_add: [ "NET_BIND_SERVICE", "CHOWN", "SETGID", "SETUID" ]
    depends_on:
      - web
    networks:
      - frontend

  scala_interpreter:
    # No ports exposed to host; reachable internally at http://scala_interpreter:8642
    build:
      context: ./scala_interpreter
      args:
        BUILD_PLATFORM: linux/amd64
    environment:
      - PORT=8642
      # cap memory for interpreter
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m
    restart: unless-stopped
    user: "10001:10001"  # reenforce non-root user
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Runtime limits effective in docker compose (non-swarm):
    mem_limit: 1g               # mirrors -Xmx but caps total container memory
    cpus: "1"                   # or cpu_quota: 50000 & cpu_period: 100000
    pids_limit: 256             # blocks fork bombs
    ulimits:
      nproc: 512
      nofile: 4096
    stop_grace_period: 5s
    networks:
      # internal network prevents outbound Internet; only containers on this network can talk
      - compute


  newrelic_infra:
    image: newrelic/infrastructure:latest
    # privileged: true # Avoid if possible, use cap_add instead
    pid: host # Allows agent to see all host processes
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NRIA_LOG_FILE=/var/log/newrelic-infra/newrelic-infra.log
      - NRIA_OVERRIDE_HOST_ROOT=/host
      - NRIA_LOG_LEVEL=info
      - NRIA_DISPLAY_NAME=steacher1
      - NRIA_OVERRIDE_HOSTNAME=steacher1
      - NRIA_CUSTOM_ATTRIBUTES={"env":"prod","service":"steacher"}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SYS_PTRACE
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/newrelic-infra
    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - newrelic_infra_db:/var/db/newrelic-infra


  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot_data/etc:/etc/letsencrypt
      - static_data:/app/static
    read_only: true
    tmpfs:
      - /var/lib/letsencrypt
      - /var/log/letsencrypt
    security_opt:
      - no-new-privileges:true
    cap_drop: [ "ALL" ]
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  newrelic_infra_db:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # no outbound egress  
  compute:
    driver: bridge
    internal: true  # no outbound egress  
  maintenance:
    driver: bridge